[tox]
envlist = py39

[testenv]
passenv =
  MYSQL_HOST
  MYSQL_PORT
  MYSQL_DB
  MYSQL_USER
  MYSQL_PASSWORD
  CFG_FILE_PATH
  ENVIRONMENT

deps=
  pipenv
  flake8
  coveralls

commands=
  pipenv install --deploy
  pipenv run coverage run --source=ninetofiver manage.py test_ninetofiver ninetofiver/
  ; flake8 --show-source

[flake8]
max-line-length = 119
exclude = .tox *_venv .ropeproject ninetofiver/migrations/
